<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Привет!</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- ЭКРАН ВВОДА ПАРОЛЯ -->
  <div id="lock-screen" class="screen active">
    <div class="lock-container">
      
      <!-- Красивый заголовок вместо замка -->
      <div class="welcome-header">
        <span class="welcome-badge">Секретний вхід ✨</span>
        <h1 class="welcome-title">Я підготував дещо для тебе 🎁</h1>
        <p class="welcome-subtitle">Введи дату свого народження</p>
      </div>

      <!-- Индикаторы ввода (точки) -->
      <div class="pin-dots">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>

      <!-- Клавиатура (только цифры) -->
      <div class="keypad">
        <button class="key-btn" data-val="1">1</button>
        <button class="key-btn" data-val="2">2</button>
        <button class="key-btn" data-val="3">3</button>
        <button class="key-btn" data-val="4">4</button>
        <button class="key-btn" data-val="5">5</button>
        <button class="key-btn" data-val="6">6</button>
        <button class="key-btn" data-val="7">7</button>
        <button class="key-btn" data-val="8">8</button>
        <button class="key-btn" data-val="9">9</button>
        <button class="key-btn empty"></button>
        <button class="key-btn" data-val="0">0</button>
        <button class="key-btn" id="delete-btn">⌫</button>
      </div>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
