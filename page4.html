<!DOCTYPE html>
<html lang="ru">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Особый подарок</title>

  <div id="gift-intro-screen" class="screen active">
    <div class="gift-container">
      
      <!-- Карточка с текстом -->

        <h1 class="gift-title">Якщо ти тут означає я вгадав</h1>
        <p class="gift-text">
          Минулий екран був не просто так, тому що ти знаєш як я люблю музику, то саме тому я приготував для тебе подарунок пов'язаний з твоїм улюбленим виконавцем, я думаю тобі буде приємно.
        </p>
        
        <!-- Кнопка перехода -->
        <button id="next-to-page5" class="btn btn-primary gift-btn">
          Далі ➔
        </button>
      </div>

    </div>
  </div>

  <script src="script.js"></script>
